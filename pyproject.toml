[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gewvol"
version = "1.0.0"
description = "GEW-Transformer: hybrid GARCH/EGARCH/EWMA + Transformer forecasting of NIFTY 50 realized volatility"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atharva Dhoot" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "arch>=7.0",
    "yfinance>=0.2.50",
    "torch>=2.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
